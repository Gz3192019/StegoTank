name: Build & Release APK

# 触发方式：
# 1) 推送 tag v*（如 v1.0.0）→ 自动构建并发布 Release
# 2) 手动触发（Actions 页面 Run workflow）→ 使用 build.gradle.kts 中的 versionName 发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 预装 Android SDK；自动接受 license（AGP 会按需下载 platform/build-tools）
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build Release APK
        run: |
          chmod +x android-compose/gradlew
          # GitHub Actions 网络无法访问阿里云镜像（502），改用官方仓库；仅 CI 生效，不影响本地
          sed -i '/aliyun\.com/d' android-compose/settings.gradle.kts
          cd android-compose && ./gradlew assembleRelease --no-daemon

      - name: Determine version
        id: ver
        run: |
          # tag 推送（v*）时用 tag 名；手动触发时读 build.gradle.kts 的 versionName
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER=$(grep -oP 'versionName = "\K[^"]+' android-compose/app/build.gradle.kts | head -1)
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          APK="android-compose/app/build/outputs/apk/release/app-release.apk"
          OUT="StegoTank-$VER.apk"
          cp "$APK" "$OUT"
          NOTES="自动构建自 GitHub Actions（StegoTank $VER）。更新日志详见仓库 RELEASE_NOTES.md"
          # 若该版本已存在 Release 则追加资产，否则创建
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VER" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VER" "$OUT" \
              --repo "$GITHUB_REPOSITORY" \
              --title "StegoTank $VER" \
              --notes "$NOTES"
          fi
